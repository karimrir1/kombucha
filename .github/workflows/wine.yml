name: Build Wine
on: [ push, pull_request ]
permissions:
  contents: write
  pull-requests: read
env:
  WINE_VERSION: "proton"
  WINE_COMMIT: "986bda11d3e569813ec0f86e56ef94d7c384da04"
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Fetch sources
      run: |
        echo "TAG=${{ env.WINE_VERSION }}+$(date --utc +%Y%m%d%H%M)" >> $GITHUB_ENV

        git clone https://github.com/ValveSoftware/wine.git --depth 1 \
          --revision=${{ env.WINE_COMMIT }}

    - name: Apply patches
      run: |
        echo "INSTALL=${{ github.workspace }}/kombucha-${{ env.TAG }}" >> $GITHUB_ENV

        git -C wine apply "$GITHUB_WORKSPACE"/patches/*.patch

    - name: Install build dependencies
      run: |
        sudo apt update -y
        sudo apt install \
          autoconf \
          build-essential \
          binutils \
          ccache \
          gcc-mingw-w64-x86-64 \
          gettext \
          libasound2-dev \
          libavcodec-dev \
          libavformat-dev \
          libcapi20-dev \
          libcups2-dev \
          libfontconfig-dev \
          libfreetype-dev \
          libgl-dev \
          libgnutls28-dev \
          libgphoto2-dev \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          libkrb5-dev \
          libpcap-dev \
          libpcsclite-dev \
          libpulse-dev \
          libudev-dev \
          libunwind-dev \
          libusb-1.0-0-dev \
          libsane-dev \
          libsdl2-dev \
          libv4l-dev \
          libvulkan-dev \
          libwayland-dev \
          libx11-dev \
          libxcomposite-dev \
          libxcursor-dev \
          libxext-dev \
          libxfixes-dev \
          libxi-dev \
          libxkbcommon-dev \
          libxkbregistry-dev \
          libxrandr-dev \
          libxrender-dev \
          ocl-icd-opencl-dev \
          samba-dev

    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2

    - name: Configure Wine
      working-directory: wine
      run: |
        export CFLAGS='-O2 -ftree-vectorize -pipe -march=x86-64-v2 -mpclmul -msse4.2 -floop-nest-optimize -fgraphite-identity'
        export x86_64_CFLAGS="$CFLAGS"
        mkdir -p ${{ env.INSTALL }}
        ./autogen.sh
        ./configure \
          CC='ccache gcc' \
          x86_64_CC='ccache x86_64-w64-mingw32-gcc' \
          --disable-tests \
          --disable-win16 \
          --enable-archs=x86_64 \
          --prefix=${{ env.INSTALL }} \
          --with-mingw \
          --without-ffmpeg \
          --without-gstreamer \
          --without-opencl \
          --without-oss

    - name: Build Wine
      working-directory: wine
      run: make -j$(($(nproc) + 1))

    - name: Install Wine
      working-directory: wine
      run: make install-lib LDCONFIG=/bin/true UPDATE_DESKTOP_DATABASE=/bin/true

    - name: Publish
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        TARBALL="kombucha-${{ env.TAG }}.tar.xz"

        cd "${{ env.INSTALL }}"/..
        XZ_OPT=-9 tar -Jcf "$TARBALL" "$(basename ${{ env.INSTALL }})"

        gh release create --prerelease --generate-notes "${{ env.TAG }}" "$TARBALL"
